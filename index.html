<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cool Pics - Responsive Gallery" />
  <meta name="author" content="Sydney Solomon" />
  <title>📷 Cool Pics</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="brand">
      <img class="brand__logo" src="images/norris-sm.jpg" alt="BYU-Idaho logo" />
      <h1 class="brand__title">📷 Cool Pics</h1>
    </div>

    <nav class="site-nav" aria-label="Primary navigation">
      <button class="menu-btn" type="button" aria-label="Menu (disabled in Part 1)">
        ☰ Menu
      </button>

      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="container">
    <section class="intro">
      <h2>Gallery</h2>
      <p>A responsive gallery layout. Images stay square using <code>object-fit: cover</code>.</p>
    </section>

    <section class="gallery" aria-label="Photo gallery">
      <figure class="card">
        <img src="images/norris-sm.jpg" alt="Sample photo 1" />
        <figcaption>Sample Pic 1</figcaption>
      </figure>

      <figure class="card">
        <img src="images/norris-sm.jpg" alt="Sample photo 2" />
        <figcaption>Sample Pic 2</figcaption>
      </figure>

      <figure class="card">
        <img src="images/norris-sm.jpg" alt="Sample photo 3" />
        <figcaption>Sample Pic 3</figcaption>
      </figure>

      <figure class="card">
        <img src="images/norris-sm.jpg" alt="Sample photo 4" />
        <figcaption>Sample Pic 4</figcaption>
      </figure>

      <figure class="card">
        <img src="images/norris-sm.jpg" alt="Sample photo 5" />
        <figcaption>Sample Pic 5</figcaption>
      </figure>

      <figure class="card">
        <img src="images/norris-sm.jpg" alt="Sample photo 6" />
        <figcaption>Sample Pic 6</figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Brigham Young University - Idaho</p>
  </footer>
</body>
</html>
